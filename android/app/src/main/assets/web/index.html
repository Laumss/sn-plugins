<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Notipal AI</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; background: #fff; color: #000;
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  -webkit-text-size-adjust: 100%;
}
body { overflow: hidden; }
button {
  font: inherit; background: #fff; color: #000; border: 1px solid #000; border-radius: 2px;
  min-height: 44px; min-width: 44px; padding: 0 12px; cursor: pointer; white-space: nowrap;
}
button:disabled { border-style: dashed; cursor: default; }
button.primary { background: #000; color: #fff; }
button.primary:disabled { background: #fff; color: #000; }
button.small { min-height: 36px; min-width: 36px; padding: 0 10px; font-size: 14px; }
input, textarea, select {
  font: inherit; border: 1px solid #000; border-radius: 2px; background: #fff; color: #000;
  padding: 8px; min-height: 44px; width: 100%;
}
textarea { resize: vertical; }
textarea.log { width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.4; white-space: pre; overflow: auto; }
select { appearance: auto; }
a { color: #000; }
hr { border: 0; border-top: 1px solid #000; margin: 12px 0; }
[hidden] { display: none !important; }

#app { display: flex; flex-direction: column; height: 100%; }
#topbar {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid #000; flex: none;
}
#conn { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; }
.dot { display: inline-block; width: 12px; height: 12px; border: 1px solid #000; background: #fff; }
.dot.on { background: #000; }
#title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
#banner {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid #000; font-size: 14px; flex: none;
}
#banner span { flex: 1; }

#main { flex: 1; display: flex; min-height: 0; position: relative; }
#sidebar { width: 300px; flex: none; border-right: 1px solid #000; overflow: auto; background: #fff; }
#scrim { display: none; }
.conv {
  display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid #000; border-radius: 0;
  padding: 10px 12px; min-height: 56px; white-space: normal;
}
.conv.current { background: #000; color: #fff; }
.conv .conv-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv .conv-meta { display: block; font-size: 12px; opacity: 1; }
.conv.current .conv-meta { color: #fff; }

#chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#messages { flex: 1; overflow: auto; padding: 12px; overscroll-behavior: contain; }
#empty { padding: 24px 12px; text-align: center; }
.msg { margin: 0 0 18px; max-width: 900px; }
.msg.user { border-left: 3px solid #000; padding-left: 12px; }
.msg .role { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; }
.msg .body > :first-child { margin-top: 0; }
.msg .body > :last-child { margin-bottom: 0; }
.msg img.part { display: block; max-width: 100%; max-height: 60vh; border: 1px solid #000; margin: 6px 0; }
.msg .part-doc { display: inline-block; border: 1px solid #000; padding: 4px 10px; margin: 6px 0; }
.msg .gen { display: inline-block; width: 10px; height: 18px; background: #000; vertical-align: text-bottom; margin-left: 2px; }
.body p { margin: 8px 0; white-space: pre-wrap; word-break: break-word; }
.body h1, .body h2, .body h3, .body h4 { margin: 12px 0 6px; line-height: 1.3; }
.body h1 { font-size: 1.4em; } .body h2 { font-size: 1.25em; } .body h3 { font-size: 1.1em; } .body h4 { font-size: 1em; }
.body pre { border: 1px solid #000; padding: 8px; overflow: auto; margin: 8px 0; white-space: pre; }
.body code { font-family: ui-monospace, Menlo, Consolas, "Courier New", monospace; font-size: .95em; }
.body :not(pre) > code { border: 1px solid #000; padding: 0 3px; }
.body blockquote { border-left: 2px solid #000; margin: 8px 0; padding: 0 0 0 12px; }
.body ul, .body ol { margin: 8px 0; padding-left: 24px; }
.body li { margin: 2px 0; white-space: pre-wrap; }
.body hr { margin: 10px 0; }
.body table { border-collapse: collapse; }
.body td, .body th { border: 1px solid #000; padding: 2px 6px; }

#composer { border-top: 1px solid #000; padding: 8px; flex: none; }
#attachments { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
#attachments img { height: 56px; border: 1px solid #000; }
#attachments .att { position: relative; display: inline-block; }
#attachments .att button { position: absolute; top: 0; right: 0; min-height: 24px; min-width: 24px; padding: 0; font-size: 12px; line-height: 1; }
#composer-row { display: flex; gap: 8px; align-items: flex-end; }
#input { flex: 1; min-height: 44px; max-height: 40vh; }
#composer-buttons { display: flex; gap: 6px; }

#settings { flex: 1; overflow: auto; padding: 12px; }
#settings .inner { max-width: 820px; }
.card { border: 1px solid #000; padding: 12px; margin: 0 0 12px; }
.card h3 { margin: 0 0 8px; font-size: 1.05em; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.row label { flex: none; min-width: 110px; font-size: 14px; }
.row input, .row select, .row textarea { flex: 1; min-width: 160px; width: auto; }
.row.stack { display: block; }
.row.stack label { display: block; margin-bottom: 4px; }
.hint { font-size: 13px; margin: 4px 0 8px; }
.notice { border: 1px solid #000; padding: 8px 12px; margin-bottom: 12px; }
.hint.bad, .check.bad { font-weight: 600; }
.check { font-size: 13px; flex: 1; min-width: 0; }
.card.provider { margin-bottom: 8px; }
details.more > summary { cursor: pointer; min-height: 36px; line-height: 36px; font-size: 14px; }
.model-row select { flex: 0 1 180px; min-width: 120px; }
#setup-note { display: flex; align-items: center; gap: 8px; margin: 0 8px 8px; flex: none; }
#setup-note span { flex: 1; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 14px; }
.sr { position: absolute; left: -9999px; }

#menu { position: absolute; top: 0; right: 8px; background: #fff; border: 1px solid #000; z-index: 20; }
#menu button { display: block; width: 100%; border: 0; border-bottom: 1px solid #000; border-radius: 0; text-align: left; }
#menu button:last-child { border-bottom: 0; }
#toast {
  position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); background: #000; color: #fff;
  padding: 8px 14px; max-width: 90%; font-size: 14px; z-index: 30;
}

@media (max-width: 900px) {
  #sidebar { position: absolute; left: 0; top: 0; bottom: 0; width: min(85vw, 320px); z-index: 11; display: none; }
  #sidebar.open { display: block; }
  #scrim.open { display: block; position: absolute; inset: 0; background: rgba(0,0,0,.25); z-index: 10; }
  .row label { min-width: 90px; }
}
@media (min-width: 901px) {
  #btn-list { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="btn-list" class="small" aria-label="list">&#9776;</button>
    <span id="conn"><span id="conn-dot" class="dot"></span><span id="conn-text"></span></span>
    <span id="title"></span>
    <button id="btn-menu" class="small" aria-label="menu">&#8943;</button>
    <button id="btn-new" class="small"></button>
    <button id="btn-settings" class="small"></button>
  </header>
  <div id="banner"><span id="banner-text"></span><button id="banner-close" class="small" aria-label="close">&#215;</button></div>
  <div id="main">
    <aside id="sidebar"><div id="conv-list"></div></aside>
    <div id="scrim"></div>
    <section id="chat">
      <div id="messages"><div id="empty"></div></div>
      <div id="setup-note" class="notice" hidden><span id="setup-text"></span><button id="setup-go" class="small"></button></div>
      <div id="composer">
        <div id="attachments"></div>
        <div id="composer-row">
          <textarea id="input" rows="2"></textarea>
          <div id="composer-buttons">
            <button id="btn-attach"></button>
            <button id="btn-stop" hidden></button>
            <button id="btn-send" class="primary"></button>
          </div>
        </div>
        <input type="file" id="file-input" accept="image/*" multiple class="sr">
      </div>
    </section>
    <section id="settings" hidden><div class="inner" id="settings-inner"></div></section>
    <div id="menu" hidden>
      <button id="menu-rename"></button>
      <button id="menu-delete"></button>
    </div>
    <div id="toast" hidden></div>
  </div>
</div>

}

function hostOf(url) {
  try { return new URL(url, location.href).host; } catch (e) { return String(url); }

function log(...parts) {
  const text = parts.map((p) => (typeof p === 'string' ? p : (p instanceof Error ? p.message : JSON.stringify(p)))).join(' ');
  const line = new Date().toISOString().slice(11, 23) + ' ' + text;
  logLines.push(line);
  if (logLines.length > 300) logLines.shift();
  console.log('[relay]', line);
  logOutbox.push(line);
  if (logOutbox.length > 100) logOutbox.shift();
  if (!logTimer) logTimer = setTimeout(flushLog, 1000);
  const box = $('log-box');
  if (box) { box.value = logLines.join('\n'); box.scrollTop = box.scrollHeight; }
}

function flushLog() {
  logTimer = null;
  if (!token || !authOk || !logOutbox.length) return;
  const lines = logOutbox;
  logOutbox = [];

  fetch('/web/log', {
    method: 'POST',
    headers: { 'X-Relay-Token': token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ lines }),
  }).catch(() => {});
}

async function netFetch(url, init, target) {
  try {
    return await fetch(url, init);
  } catch (e) {
    if (e && e.name === 'AbortError') throw e;
    log('net', target, (init && init.method) || 'GET', safeUrl(url), errorText(e));
    const where = target === 'supernote' ? t('netSupernote') : t('netProvider') + ' ' + hostOf(url);
    throw new Error(where + ': ' + errorText(e) + (target === 'provider' ? ' ' + t('netHint') : ''));
  }
}

(function readTokenFromUrl() {
  const params = new URLSearchParams(location.search);
  const given = params.get('t');
  if (given) {
    token = given.trim();
    localStorage.setItem(TOKEN_KEY, token);
    params.delete('t');
    const rest = params.toString();
    history.replaceState(null, '', location.pathname + (rest ? '?' + rest : ''));
  }
})();

class ApiError extends Error {
  constructor(status, message) { super(message); this.status = status; }
}

async function api(method, path, body) {
  const headers = { 'X-Relay-Token': token };
  let payload;
  if (body instanceof FormData) payload = body;
  else if (body !== undefined) { headers['Content-Type'] = 'application/json'; payload = JSON.stringify(body); }
  const res = await netFetch(path, { method, headers, body: payload }, 'supernote');
  if (res.status === 401) { log('api', method, path, '401'); setAuth(false); throw new ApiError(401, t('authBad')); }
  setAuth(true);
  if (res.status === 204) return null;
  const text = await res.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch (e) { json = null; }
  if (!res.ok) {
    const message = (json && json.error) || text || ('HTTP ' + res.status);
    log('api', method, path, String(res.status), String(message).slice(0, 200));
    throw new ApiError(res.status, message);
  }
  return json;
}

function withToken(path) {
  return path + (path.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(token);
}

function fileUrl(url) {
  if (!url) return '';
  if (/^https?:|^data:|^blob:/i.test(url)) return url;
  return withToken(location.origin + url);
}

function setAuth(ok) {
  if (authOk === ok) return;
  authOk = ok;
  if (!ok) {

    log('access code refused by the Supernote; waiting for a new one');
    clearTimeout(workerTimer);
    if (workerES) { workerES.close(); workerES = null; }
    workerConnected = false;
    closeStream();
    stopStatusPolling();
    renderConn();
    showView('settings');
    return;
  }
  renderConn();
  if (view === 'settings') renderSettings();
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function inline(text) {

  const codes = [];
  let s = escapeHtml(text).replace(/`([^`\n]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  s = s.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_\n]+?)__/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\w)/g, '$1<em>$2</em>');
  s = s.replace(/(^|[^_\w])_([^_\n]+?)_(?!\w)/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~\n]+?)~~/g, '<del>$1</del>');
  s = s.replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + codes[Number(i)] + '</code>');
  return s;
}

function renderMarkdown(text) {
  const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let i = 0;
  const para = [];
  function flushPara() {
    if (!para.length) return;
    out.push('<p>' + inline(para.join('\n')) + '</p>');
    para.length = 0;
  }
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if ((m = line.match(/^\s*(```|~~~)\s*([\w+-]*)\s*$/))) {
      flushPara();
      const fence = m[1];
      const code = [];
      i++;
      while (i < lines.length && !lines[i].match(new RegExp('^\\s*' + fence + '\\s*$'))) { code.push(lines[i]); i++; }
      i++;
      out.push('<pre><code' + (m[2] ? ' class="lang-' + escapeHtml(m[2]) + '"' : '') + '>' + escapeHtml(code.join('\n')) + '</code></pre>');
      continue;
    }
    if (line.match(/^\s*\$\$\s*$/)) {

      flushPara();
      const math = ['$$'];
      i++;
      while (i < lines.length && !lines[i].match(/^\s*\$\$\s*$/)) { math.push(lines[i]); i++; }
      math.push('$$');
      i++;
      out.push('<p>' + escapeHtml(math.join('\n')) + '</p>');
      continue;
    }
    if ((m = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))) {
      flushPara();
      const level = Math.min(m[1].length, 4);
      out.push('<h' + level + '>' + inline(m[2]) + '</h' + level + '>');
      i++;
      continue;
    }
    if (line.match(/^\s*([-*_])(\s*\1){2,}\s*$/)) {
      flushPara();
      out.push('<hr>');
      i++;
      continue;
    }
    if (line.match(/^\s*>/)) {
      flushPara();
      const quote = [];
      while (i < lines.length && lines[i].match(/^\s*>/)) { quote.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
      out.push('<blockquote>' + renderMarkdown(quote.join('\n')) + '</blockquote>');
      continue;
    }
    if ((m = line.match(/^(\s*)([-*+]|\d+[.)])\s+/))) {
      flushPara();
      const ordered = /\d/.test(m[2]);
      const items = [];
      const baseIndent = m[1].length;
      while (i < lines.length) {
        const l = lines[i];
        const im = l.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (im && im[1].length <= baseIndent + 1) { items.push([im[3]]); i++; continue; }
        if (items.length && l.trim() !== '' && (l.match(/^\s+/) || !l.match(/^(\s*)([-*+]|\d+[.)])\s+/))) {

          if (l.match(/^\s*$/)) break;
          if (!l.match(/^\s+/) ) break;
          items[items.length - 1].push(l.trim());
          i++;
          continue;
        }
        break;
      }
      out.push('<' + (ordered ? 'ol' : 'ul') + '>' + items.map((it) => '<li>' + inline(it.join('\n')) + '</li>').join('') + '</' + (ordered ? 'ol' : 'ul') + '>');
      continue;
    }
    if (line.match(/^\s*\|.*\|\s*$/) && i + 1 < lines.length && lines[i + 1].match(/^\s*\|?\s*:?-{2,}/)) {
      flushPara();
      const rows = [];
      while (i < lines.length && lines[i].match(/^\s*\|.*\|\s*$/)) { rows.push(lines[i]); i++; }
      const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()));
      const head = cells(rows[0]);
      const body = rows.slice(2).map(cells);
      out.push('<table><thead><tr>' + head.map((c) => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>' +
        body.map((r) => '<tr>' + r.map((c) => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table>');
      continue;
    }
    if (line.trim() === '') { flushPara(); i++; continue; }
    para.push(line);
    i++;
  }
  flushPara();
  return out.join('');
}

function fmtTime(ms) {
  const d = new Date(ms);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const opts = { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' };
  if (!sameDay) { opts.month = 'numeric'; opts.day = 'numeric'; }
  try { return d.toLocaleString(lang, opts); } catch (e) {   }
  const hh = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  if (sameDay) return hh;
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hh;
}

}

async function openConversation(id, announce = true) {
  if (cur.id === id && cur.data) return;
  closeStream();
  cur.id = id;
  cur.data = null;
  renderMessages();
  try {
    cur.data = await api('GET', '/api/conversations/' + encodeURIComponent(id));
  } catch (e) {
    if (e.status !== 401) toast(t('loadFailed') + errorText(e));
    cur.id = null;
    renderMessages();
    renderTitle();
    return;
  }
  if (cur.id !== id) return;
  renderMessages();
  renderTitle();
  renderList();
  openStream(id);
  if (announce) api('POST', '/web/active', { conversationId: id }).catch(() => {});
}

function closeConversation() {
  closeStream();
  cur.id = null;
  cur.data = null;
  renderMessages();
  renderTitle();
  renderList();
}

function followActive(data) {
  scheduleListRefresh();
  let id = null;
  try { id = JSON.parse(data).conversationId; } catch (e) {   }
  if (!id || id === cur.id) return;
  log('following conversation', id);
  openConversation(id, false);
}

function closeStream() {
  if (cur.es) { cur.es.close(); cur.es = null; }
}

function openStream(id) {
  const es = new EventSource(withToken('/api/conversations/' + encodeURIComponent(id) + '/stream'));
  cur.es = es;
  es.addEventListener('snapshot', (e) => {
    if (cur.id !== id) return;
    try {
      const data = JSON.parse(e.data);
      cur.data = data.conversation;
      renderMessages();
      renderTitle();
    } catch (err) {   }
  });
  es.addEventListener('node_update', (e) => {
    if (cur.id !== id || !cur.data) return;
    try {
      const data = JSON.parse(e.data);
      const nodes = cur.data.messages || (cur.data.messages = []);
      if (data.nodeIndex < nodes.length) nodes[data.nodeIndex] = data.node;
      else if (data.nodeIndex === nodes.length) nodes.push(data.node);
      else return;
      cur.data.isGenerating = !!data.isGenerating;
      cur.data.updateAt = data.updateAt;
      updateNode(data.nodeIndex);
      renderComposerState();
    } catch (err) {   }
  });
  es.onerror = () => {   };
}

function selectedMessage(node) {
  if (!node || !node.messages || !node.messages.length) return null;
  const idx = Math.min(Math.max(node.selectIndex || 0, 0), node.messages.length - 1);
  return node.messages[idx];
}

function messageText(message) {
  return (message.parts || []).filter((p) => p.type === 'text').map((p) => p.text || '').join('');
}

function renderNodeEl(node, index) {
  const message = selectedMessage(node);
  const el = document.createElement('div');
  el.dataset.index = index;
  if (!message) { el.hidden = true; return el; }
  const user = message.role === 'USER';
  el.className = 'msg ' + (user ? 'user' : 'assistant');
  const role = document.createElement('div');
  role.className = 'role';
  role.textContent = user ? t('you') : t('assistant');
  el.appendChild(role);
  const body = document.createElement('div');
  body.className = 'body';
  let html = '';
  for (const part of message.parts || []) {
    if (part.type === 'image' && part.url) html += '<img class="part" src="' + escapeHtml(fileUrl(part.url)) + '" alt="">';

    else if (part.type === 'document') html += '<div class="part-doc">' + escapeHtml(part.fileName || 'PDF') + '</div>';
  }
  const text = messageText(message);
  const open = !user && !message.finishedAt && cur.data && cur.data.isGenerating;

  const error = (message.parts || []).filter((p) => p.type === 'error').map((p) => p.text || '').join('\n');
  if (text) html += renderMarkdown(text);
  else if (open) html += '<p>' + t('generating') + '…</p>';
  if (error) html += '<p><b>[' + t('errorLabel') + ']</b> ' + escapeHtml(error) + '</p>';
  if (open) html += '<span class="gen"></span>';
  body.innerHTML = html;
  el.appendChild(body);
  return el;
}

function nearBottom() {
  const box = $('messages');
  return box.scrollHeight - box.scrollTop - box.clientHeight < 120;
}

function scrollBottom() {
  const box = $('messages');
  box.scrollTop = box.scrollHeight;
}

function renderMessages() {
  const box = $('messages');
  const stick = nearBottom();
  box.textContent = '';
  const empty = document.createElement('div');
  empty.id = 'empty';
  empty.textContent = t('noConversation');
  if (!cur.data || !(cur.data.messages || []).length) {
    box.appendChild(empty);
  } else {
    cur.data.messages.forEach((node, i) => box.appendChild(renderNodeEl(node, i)));
  }
  renderComposerState();
  if (stick) scrollBottom();
}

function updateNode(index) {
  const box = $('messages');
  const stick = nearBottom();
  const existing = box.querySelector('[data-index="' + index + '"]');
  const fresh = renderNodeEl(cur.data.messages[index], index);
  if (existing) existing.replaceWith(fresh);
  else {
    const empty = $('empty');
    if (empty) empty.remove();
    box.appendChild(fresh);
  }
  if (stick) scrollBottom();
}

function renderComposerState() {
  const generating = !!(cur.data && cur.data.isGenerating);
  $('btn-stop').hidden = !generating;
  $('btn-send').disabled = !token;
  renderSetupNote();
}

function renderAttachments() {
  const box = $('attachments');
  box.textContent = '';
  attachments.forEach((url, i) => {
    const wrap = document.createElement('span');
    wrap.className = 'att';
    const img = document.createElement('img');
    img.src = fileUrl(url);
    const rm = document.createElement('button');
    rm.textContent = '×';
    rm.onclick = () => { attachments.splice(i, 1); renderAttachments(); };
    wrap.appendChild(img);
    wrap.appendChild(rm);
    box.appendChild(wrap);
  });
}

async function uploadFiles(files) {
  for (const file of files) {
    const fd = new FormData();
    fd.append('file', file, file.name || 'image.png');
    try {
      const res = await api('POST', '/api/files/upload', fd);
      const url = res && res.files && res.files[0] && res.files[0].url;
      if (url) attachments.push(url);
    } catch (e) {
      toast(t('uploadFailed') + errorText(e));
    }
  }
  renderAttachments();
}

async function sendMessage() {
  const input = $('input');
  const text = input.value.trim();
  const images = attachments.slice();
  if (!text && !images.length) return;
  $('btn-send').disabled = true;
  try {
    if (!cur.id) {
      const created = await api('POST', '/api/conversations', {});
      await openConversation(created.conversationId);
      scheduleListRefresh();
    }
    const parts = images.map((url) => ({ type: 'image', url }));
    if (text) parts.push({ type: 'text', text });
    await api('POST', '/api/conversations/' + encodeURIComponent(cur.id) + '/messages', { parts });
    input.value = '';
    attachments = [];
    renderAttachments();
    autosize();
  } catch (e) {
    toast(t('sendFailed') + errorText(e));
  } finally {
    renderComposerState();
  }
}

async function stopGeneration() {
  if (!cur.id) return;
  try { await api('POST', '/api/conversations/' + encodeURIComponent(cur.id) + '/stop', {}); } catch (e) { toast(errorText(e)); }
}

async function newConversation() {
  try {
    const created = await api('POST', '/api/conversations', {});
    await openConversation(created.conversationId);
    scheduleListRefresh();
    showView('chat');

async function renameConversation() {
  if (!cur.id || !cur.data) return;
  const shown = convTitle(cur.data);
  const title = prompt(t('renamePrompt'), shown);
  if (title === null) return;
  const clean = title.trim();

  try {

async function deleteConversation() {

function resolveModel(ref) {

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'text') node.textContent = attrs[k];
    else if (k === 'html') node.innerHTML = attrs[k];
    else if (k.startsWith('on')) node[k] = attrs[k];
    else if (k === 'hidden') node.hidden = !!attrs[k];
    else node.setAttribute(k, attrs[k]);
  }
  (children || []).forEach((c) => { if (c) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return node;
}

function row(labelText, control, extra) {

function providerName(p) {
  const preset = presetOf(p);
  if (preset.id === 'custom' && (!p.name || Object.values(STRINGS).some((s) => s.customProvider === p.name))) return t('customProvider');
  return p.name || preset.name || p.type;
}

function presetOf(p) {
  if (p.preset) return PRESETS.find((x) => x.id === p.preset) || PRESETS[PRESETS.length - 1];

  const base = String(p.baseUrl || DEFAULT_BASE[p.type] || '').replace(/\/+$/, '');
  return PRESETS.find((x) => x.id !== 'custom' && x.type === p.type && x.baseUrl === base) || PRESETS[PRESETS.length - 1];
}

const NOT_CHAT = /embed|tts|whisper|dall-e|image|moderation|rerank|audio|realtime|transcri|speech|davinci|babbage|sora|veo|imagen|aqa|computer-use|-search|ocr/i;
function chatModels(list) { return (list || []).filter((m) => !NOT_CHAT.test(m)); }

function versionOf(id) {
  const dated = /\d{4}-\d{2}-\d{2}|\d{8}/.test(id);
  const nums = (id.replace(/\d{4}-\d{2}-\d{2}|\d{8}/g, '').match(/\d+/g) || []).map(Number);
  return { nums, dated };
}
function newer(a, b) {
  const x = versionOf(a), y = versionOf(b);
  for (let i = 0; i < Math.max(x.nums.length, y.nums.length); i++) {
    const d = (x.nums[i] || 0) - (y.nums[i] || 0);
    if (d) return d > 0;
  }
  if (x.dated !== y.dated) return !x.dated;
  return a.length < b.length;
}

function pickChatModel(p) {
  const list = chatModels(p.models);
  for (const re of presetOf(p).prefer) {
    const hits = list.filter((m) => re.test(m));
    if (hits.length) return hits.reduce((best, m) => (newer(m, best) ? m : best));
  }
  return list[0] || null;
}

async function checkProvider(p) {
  if (!p.apiKey) { checks.delete(p.id); renderCheck(p); return; }
  const seq = (checks.get(p.id) && checks.get(p.id).seq || 0) + 1;
  checks.set(p.id, { state: 'checking', text: t('checking'), seq });
  renderCheck(p);
  let result;
  try {
    const list = await fetchModelList(p);
    p.models = list;
    const picked = autoPick(p);
    scheduleSave();
    result = { state: 'ok', text: t('checkOk').replace('%d', String(chatModels(list).length)) };
    if (picked) log('chat model picked:', p.name, picked);
  } catch (e) {
    let text;
    if (e.status === 401 || e.status === 403) text = t('checkBadKey');
    else if (e.status === 404) text = t('checkNoList');
    else text = errorText(e);
    result = { state: 'error', text };
  }
  if (!providerById(p.id) || (checks.get(p.id) || {}).seq !== seq) return;
  checks.set(p.id, Object.assign(result, { seq }));
  renderCheck(p);
  refreshModelPickers();
  renderSetupNote();
}

function autoPick(p) {
  if (resolveModel(settings.chatModel)) return null;
  const model = pickChatModel(p);
  if (!model) return null;
  settings.chatModel = { providerId: p.id, model };
  settings.chatModelAuto = true;
  reopenWorker();
  return model;
}

function renderProvider(p) {
  const preset = presetOf(p);
  const custom = preset.id === 'custom';
  const card = el('div', { class: 'card provider' });
  const title = el('strong', { text: providerName(p) });
  card.appendChild(el('div', { class: 'row' }, [title, el('span', { class: 'check', 'data-check': p.id })]));

  const key = el('input', { type: 'password', value: p.apiKey || '', autocomplete: 'off', spellcheck: 'false', placeholder: t('keyPlaceholder'), 'data-key': p.id });
  const commitKey = () => {
    const value = key.value.trim();
    if (value === p.apiKey) return;
    p.apiKey = value;
    scheduleSave();
    reopenWorker();
    checkProvider(p);
  };
  key.onchange = commitKey;
  key.onpaste = () => setTimeout(commitKey, 0);
  const toggle = el('button', { class: 'small', text: t('show') });
  toggle.onclick = () => { const show = key.type === 'password'; key.type = show ? 'text' : 'password'; toggle.textContent = show ? t('hide') : t('show'); };
  card.appendChild(row(t('apiKey'), key, toggle));

  const base = el('input', { type: 'text', value: p.baseUrl || '', placeholder: custom ? 'https://…/v1' : (preset.baseUrl || DEFAULT_BASE[p.type] || '') });
  base.onchange = () => { p.baseUrl = base.value.trim(); scheduleSave(); checkProvider(p); };
  const baseRow = row(t('baseUrl'), base);

  if (custom) card.appendChild(baseRow);

  const name = el('input', { type: 'text', value: p.name || '' });
  name.oninput = () => { p.name = name.value; title.textContent = providerName(p); scheduleSave(); refreshModelPickers(); };
  const typeSel = el('select', {}, ['openai', 'anthropic', 'gemini'].map((ty) => el('option', { value: ty, text: t('type_' + ty) })));
  typeSel.value = p.type;
  typeSel.onchange = () => { p.type = typeSel.value; scheduleSave(); checkProvider(p); };
  const models = el('textarea', { rows: '4', spellcheck: 'false' });
  models.value = (p.models || []).join('\n');
  models.onchange = () => { p.models = models.value.split('\n').map((s) => s.trim()).filter(Boolean); scheduleSave(); refreshModelPickers(); };
  const more = [row(t('name'), name)];
  if (!custom) more.push(baseRow);
  if (custom || p.type !== preset.type) more.push(row(t('type'), typeSel));
  more.push(el('div', { class: 'row stack' }, [el('label', { text: t('models') }), el('div', { class: 'hint', text: t('modelsHint') }), models]));
  more.push(el('div', { class: 'row' }, [
    el('button', { class: 'small', text: t('recheck'), onclick: () => checkProvider(p).then(() => { models.value = (p.models || []).join('\n'); }) }),
    el('button', { class: 'small', text: t('removeProvider'), onclick: () => {
      if (!confirm(t('removeProviderConfirm'))) return;
      settings.providers = settings.providers.filter((x) => x !== p);
      checks.delete(p.id);
      if (settings.chatModel && settings.chatModel.providerId === p.id) settings.chatModel = null;
      if (settings.translateModel && settings.translateModel.providerId === p.id) settings.translateModel = null;

      for (const other of settings.providers) if (autoPick(other)) break;
      scheduleSave();
      renderSettings();
      reopenWorker();
      renderSetupNote();
    } }),
  ]));
  card.appendChild(details('provider-' + p.id, t('providerMore'), more));
  setTimeout(() => renderCheck(p), 0);
  return card;
}

function modelRow(field, label) {
  const provSel = el('select', { 'data-prov': field });
  const list = el('datalist', { id: 'dl-' + field });
  const input = el('input', { type: 'text', list: 'dl-' + field, autocomplete: 'off', spellcheck: 'false', 'data-model': field,
    placeholder: field === 'translateModel' ? t('sameAsChat') : t('typeToSearch') });
  const commit = () => {
    const model = input.value.trim();
    const providerId = provSel.value || ((settings.providers || [])[0] || {}).id;
    settings[field] = model && providerId ? { providerId, model } : null;
    if (field === 'chatModel') settings.chatModelAuto = false;
    scheduleSave();
    reopenWorker();
    refreshModelPickers();
    renderSetupNote();
  };
  input.onchange = commit;
  provSel.onchange = () => {

    const p = providerById(provSel.value);
    if (p && input.value && (p.models || []).length && !(p.models || []).includes(input.value.trim())) input.value = '';
    fillModelList(field);
    if (input.value) commit(); else input.focus();
  };
  const box = el('div', { class: 'row model-row' }, [el('label', { text: label }), provSel, input, list]);
  return box;
}

function fillModelList(field) {
  const provSel = document.querySelector('[data-prov="' + field + '"]');
  const list = $('dl-' + field);
  if (!provSel || !list) return;
  const p = providerById(provSel.value) || (settings.providers || [])[0];
  list.textContent = '';
  for (const m of chatModels(p ? p.models : [])) list.appendChild(el('option', { value: m }));
}

function refreshModelPickers() {
  const providers = settings.providers || [];
  for (const field of ['chatModel', 'translateModel']) {
    const provSel = document.querySelector('[data-prov="' + field + '"]');
    const input = document.querySelector('[data-model="' + field + '"]');
    if (!provSel || !input) continue;
    const current = settings[field];
    const chosen = current && providerById(current.providerId) ? current.providerId : (provSel.value && providerById(provSel.value) ? provSel.value : (providers[0] || {}).id || '');
    provSel.textContent = '';
    providers.forEach((p) => provSel.appendChild(el('option', { value: p.id, text: providerName(p) })));
    provSel.value = chosen;
    provSel.hidden = providers.length < 2;
    input.disabled = !providers.length;
    if (document.activeElement !== input) input.value = current && providerById(current.providerId) ? current.model : '';
    fillModelList(field);
  }
  const hint = document.querySelector('[data-model-hint="chatModel"]');
  if (hint) {
    const problem = setupProblem();
    hint.textContent = problem ? t('setup_' + problem) : settings.chatModelAuto ? t('autoPicked') : '';
    hint.className = 'hint' + (problem ? ' bad' : '');
  }
}

function setupProblem() {
  if (!token || !authOk || !settingsLoaded) return null;
  const providers = settings.providers || [];
  if (!providers.length) return 'noProvider';
  const chat = resolveModel(settings.chatModel);
  if (!chat) return providers.some((p) => p.apiKey) ? 'noChatModel' : 'noKey';
  if (!chat.provider.apiKey) return 'noKey';
  return null;
}

function renderSetupNote() {
  const note = $('setup-note');
  if (!note) return;
  const problem = setupProblem();
  note.hidden = !problem;
  if (problem) $('setup-text').textContent = t('setup_' + problem);
}

function goToSetup() {
  showView('settings');
  const problem = setupProblem();
  const target = $(problem === 'noChatModel' ? 'models-card' : 'providers-card');
  if (target) target.scrollIntoView({ block: 'start' });
  const focus = problem === 'noChatModel' ? document.querySelector('[data-model="chatModel"]')
    : document.querySelector('[data-key]:placeholder-shown');
  if (focus) focus.focus();
}

async function refreshStatus() {
  const kv = $('status-kv');
  if (!kv) return;
  if (!authOk) { kv.textContent = ''; return; }
  try { serverState = await api('GET', '/web/state'); } catch (e) { serverState = null; }
  kv.textContent = '';
  const add = (k, v) => { kv.appendChild(el('span', { text: k })); kv.appendChild(el('span', { text: v })); };
  if (serverState) {
    add(t('address'), 'http://' + (serverState.lanIp || '?') + ':' + serverState.port + '/');
    add(t('statusWorkers'), String(serverState.workers));
    add(t('statusPending'), String(serverState.pendingJobs));
    add(t('statusTranslate'), serverState.translateReady ? t('yes') : t('no'));
  }
  add(t('thisPage'), workerConnected ? t('workerOn') : t('workerOff'));
  add(t('runningJobs'), String(jobs.size));
}

function startStatusPolling() {
  stopStatusPolling();
  statusTimer = setInterval(refreshStatus, 5000);
}

function stopStatusPolling() {
  clearInterval(statusTimer);
  statusTimer = null;
}

function workerCaps() {

  const usable = (ref) => { const m = resolveModel(ref); return m && m.provider.apiKey ? m : null; };
  const chat = usable(settings.chatModel);

  const translate = usable(settings.translateModel) || chat;
  return { chat, translate };
}

function openWorker() {
  clearTimeout(workerTimer);
  if (workerES) { workerES.close(); workerES = null; }
  if (!token || !authOk) { workerConnected = false; renderConn(); return; }
  const caps = workerCaps();
  const params = new URLSearchParams();
  params.set('t', token);
  if (caps.chat) { params.set('chat', '1'); params.set('chatModel', caps.chat.model); }
  if (caps.translate) { params.set('translate', '1'); params.set('translateModel', caps.translate.model); }
  const es = new EventSource('/web/events?' + params.toString());
  workerES = es;
  es.onopen = () => { log('worker stream open', caps.chat ? 'chat' : '-', caps.translate ? 'translate' : '-'); workerConnected = true; renderConn(); if (view === 'settings') refreshStatus(); };
  es.addEventListener('hello', (e) => {
    try { workerId = JSON.parse(e.data).workerId || null; } catch (err) { workerId = null; }
    workerConnected = true;
    renderConn();
  });

  es.addEventListener('ping', () => {
    if (!workerId || workerES !== es) return;
    api('POST', '/web/pong', { workerId }).catch((err) => {
      if (err && err.status === 404 && workerES === es) { log('worker dropped by the Supernote, reconnecting'); openWorker(); }
    });
  });
  es.addEventListener('list', scheduleListRefresh);
  es.addEventListener('active', (e) => followActive(e.data));

  es.addEventListener('open', (e) => followActive(e.data));
  es.addEventListener('job', (e) => {
    try { handleJob(JSON.parse(e.data)); } catch (err) {   }
  });
  es.addEventListener('cancel', (e) => {
    try { cancelJob(JSON.parse(e.data).jobId); } catch (err) {   }
  });
  es.onerror = () => {
    if (workerES !== es) return;
    es.close();
    workerES = null;
    workerConnected = false;
    renderConn();

    api('GET', '/web/state').then(() => {
      if (!authOk || workerES) return;
      log('worker stream lost, reconnecting in 2 s');
      workerTimer = setTimeout(openWorker, 2000);
    }, (e) => {
      if (e && e.status === 401) return;
      log('worker stream lost and the Supernote does not answer, retrying in 5 s');
      workerTimer = setTimeout(openWorker, 5000);
    });
  };
}

function reopenWorker() {
  clearTimeout(workerTimer);
  workerTimer = setTimeout(openWorker, 300);
}

function handleJob(job) {
  if (!job || !job.id || jobs.has(job.id)) return;
  const entry = { job, controller: new AbortController(), text: '', lastReport: 0, timer: null, done: false };
  jobs.set(job.id, entry);
  if (view === 'settings') refreshStatus();
  runJob(entry).catch(() => {}).then(() => {
    jobs.delete(job.id);
    if (view === 'settings') refreshStatus();
  });
}

function cancelJob(id) {
  const entry = jobs.get(id);
  if (!entry) return;
  entry.done = true;
  entry.controller.abort();
  clearTimeout(entry.timer);
}

function report(entry, what, body) {
  return api('POST', '/web/jobs/' + encodeURIComponent(entry.job.id) + '/' + what, body).catch(() => {});
}

function scheduleProgress(entry) {
  if (entry.done) return;
  const now = Date.now();
  const wait = 300 - (now - entry.lastReport);
  if (wait <= 0) {
    entry.lastReport = now;
    report(entry, 'progress', { text: answerText(entry.text) });
  } else if (!entry.timer) {
    entry.timer = setTimeout(() => {
      entry.timer = null;
      if (entry.done) return;
      entry.lastReport = Date.now();
      report(entry, 'progress', { text: answerText(entry.text) });
    }, wait);
  }
}

function stripThink(text) {
  return String(text || '').replace(/<think>[\s\S]*?(?:<\/think>|$)/g, '').trim();
}

function answerText(text) {
  const s = String(text || '');
  const head = s.trimStart();
  if (head && '<think>'.startsWith(head)) return '';
  return s.replace(/^\s*<think>[\s\S]*?(?:<\/think>|$)/, '').trimStart();
}

async function runJob(entry) {
  const job = entry.job;
  const translate = job.kind === 'translate';
  const target = (translate && resolveModel(settings.translateModel)) || resolveModel(settings.chatModel);
  const tag = 'job ' + job.kind + ' ' + String(job.id).slice(0, 8);
  log(tag, 'start', target ? target.provider.type + ' ' + hostOf(baseUrlOf(target.provider)) + ' ' + target.model : 'no model',
    translate ? (String(job.text || '').length + ' chars') : ((job.messages || []).length + ' turns'));
  if (!target) {
    await report(entry, 'error', { message: t('noChatModel'), text: '' });
    return;
  }
  if (!target.provider.apiKey) {
    await report(entry, 'error', { message: t('noApiKey'), text: '' });
    return;
  }
  let messages;
  try {
    messages = translate ? [{ role: 'user', parts: [{ type: 'text', text: job.text || '' }] }] : await prepareMessages(job.messages || []);
  } catch (e) {
    await report(entry, 'error', { message: errorText(e), text: '' });
    return;
  }
  try {
    const result = await generate({
      provider: target.provider,
      model: target.model,
      system: job.system || '',
      messages,
      temperature: settings.temperature,
      maxTokens: settings.maxTokens,
      signal: entry.controller.signal,
      onDelta: (delta) => {
        if (entry.done) return;
        entry.text += delta;
        if (!translate) scheduleProgress(entry);
      },
    });
    if (entry.done) return;
    entry.done = true;
    clearTimeout(entry.timer);
    let text = result.text || entry.text;
    text = translate ? stripThink(text) : answerText(text);
    if (!text.trim()) {
      await report(entry, 'error', { message: t('emptyReply'), text: '' });
      return;
    }
    log(tag, 'done', text.length + ' chars');
    await report(entry, 'done', { text, model: target.model, usage: result.usage || { input: 0, output: 0 } });
  } catch (e) {
    if (entry.done || entry.controller.signal.aborted) { log(tag, 'cancelled'); return; }
    entry.done = true;
    clearTimeout(entry.timer);
    log(tag, 'error', errorText(e));
    await report(entry, 'error', { message: errorText(e), text: translate ? entry.text : answerText(entry.text) });
  }
}

async function prepareMessages(history) {
  const out = [];
  for (const m of history) {
    const parts = [];
    for (const part of m.parts || []) {
      if (part.type === 'text') parts.push({ type: 'text', text: part.text || '' });
      else if (part.type === 'image' && part.url) parts.push({ type: 'image', ...(await loadImage(part.url)) });
      else if (part.type === 'document' && part.url) {
        const file = await loadImage(part.url);
        parts.push({ type: 'file', name: part.fileName || 'document.pdf', mime: 'application/pdf', data: file.data });
      }
    }
    if (parts.length) out.push({ role: m.role === 'assistant' ? 'assistant' : 'user', parts });
  }
  return out;
}

async function loadImage(url) {
  if (imageCache.has(url)) return imageCache.get(url);
  const res = await netFetch(fileUrl(url), {}, 'supernote');
  if (!res.ok) throw new Error(t('imageLoadFailed') + ' (' + res.status + ')');
  const blob = await res.blob();
  const dataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error(t('imageLoadFailed')));
    reader.readAsDataURL(blob);
  });
  const comma = dataUrl.indexOf(',');
  const info = { mime: blob.type || 'image/png', data: dataUrl.slice(comma + 1), dataUrl };
  imageCache.set(url, info);
  return info;
}

function baseUrlOf(p) {
  return (p.baseUrl || DEFAULT_BASE[p.type] || '').replace(/\/+$/, '');
}

async function providerError(res) {
  let body = '';
  try { body = await res.text(); } catch (e) { body = ''; }
  let message = body;
  try {
    const json = JSON.parse(body);
    message = (json.error && (json.error.message || json.error)) || json.message || body;
    if (typeof message !== 'string') message = JSON.stringify(message);
  } catch (e) {   }
  log('provider', hostOf(res.url), 'HTTP ' + res.status, String(message).slice(0, 300));
  const error = new Error('HTTP ' + res.status + ': ' + String(message).slice(0, 400));
  error.status = res.status;
  return error;
}

async function readSse(res, onEvent) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let event = '';
  let data = [];
  const dispatch = () => {
    if (data.length) onEvent(event, data.join('\n'));
    event = '';
    data = [];
  };
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buffer.indexOf('\n')) >= 0) {
      const line = buffer.slice(0, idx).replace(/\r$/, '');
      buffer = buffer.slice(idx + 1);
      if (line === '') { dispatch(); continue; }
      if (line.startsWith(':')) continue;
      const colon = line.indexOf(':');
      const field = colon < 0 ? line : line.slice(0, colon);
      let value2 = colon < 0 ? '' : line.slice(colon + 1);
      if (value2.startsWith(' ')) value2 = value2.slice(1);
      if (field === 'event') event = value2;
      else if (field === 'data') data.push(value2);
    }
  }
  buffer += decoder.decode();
  if (buffer.trim()) {
    for (const line of buffer.split('\n')) {
      const l = line.replace(/\r$/, '');
      if (l.startsWith('data:')) data.push(l.slice(5).replace(/^ /, ''));
    }
  }
  dispatch();
}

function generate(opts) {
  switch (opts.provider.type) {
    case 'anthropic': return callAnthropic(opts);
    case 'gemini': return callGemini(opts);
    default: return callOpenAI(opts);
  }
}

function callOpenAI(opts) {
  const messages = [];
  if (opts.system) messages.push({ role: 'system', content: opts.system });
  for (const m of opts.messages) {
    const allText = m.parts.every((p) => p.type === 'text');
    if (allText) messages.push({ role: m.role, content: m.parts.map((p) => p.text).join('') });
    else messages.push({ role: m.role, content: m.parts.map((p) => p.type === 'text'
      ? { type: 'text', text: p.text }
      : p.type === 'file'
        ? { type: 'file', file: { filename: p.name, file_data: 'data:' + p.mime + ';base64,' + p.data } }
        : { type: 'image_url', image_url: { url: p.dataUrl } }) });
  }
  const body = { model: opts.model, messages, stream: true };
  if (opts.temperature != null) body.temperature = opts.temperature;
  if (opts.maxTokens != null) body.max_tokens = opts.maxTokens;
  return (async () => {
    const res = await netFetch(baseUrlOf(opts.provider) + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + opts.provider.apiKey },
      body: JSON.stringify(body),
      signal: opts.signal,
    }, 'provider');
    if (!res.ok) throw await providerError(res);
    let text = '';
    let usage = null;
    const type = (res.headers.get('content-type') || '').toLowerCase();
    if (!type.includes('text/event-stream')) {

      const json = await res.json();
      const choice = json.choices && json.choices[0];
      text = (choice && choice.message && choice.message.content) || '';
      if (typeof text !== 'string') text = '';
      if (text) opts.onDelta(text);
      if (json.usage) usage = { input: json.usage.prompt_tokens || 0, output: json.usage.completion_tokens || 0 };
      return { text, usage };
    }
    await readSse(res, (event, data) => {
      if (data === '[DONE]') return;
      let json;
      try { json = JSON.parse(data); } catch (e) { return; }
      if (json.error) throw new Error(json.error.message || JSON.stringify(json.error));
      const choice = json.choices && json.choices[0];
      const delta = choice && choice.delta && choice.delta.content;
      if (typeof delta === 'string' && delta) { text += delta; opts.onDelta(delta); }
      if (json.usage) usage = { input: json.usage.prompt_tokens || 0, output: json.usage.completion_tokens || 0 };
    });
    return { text, usage };
  })();
}

function callAnthropic(opts) {
  const messages = opts.messages.map((m) => ({
    role: m.role,
    content: m.parts.map((p) => p.type === 'text'
      ? { type: 'text', text: p.text }
      : { type: p.type === 'file' ? 'document' : 'image', source: { type: 'base64', media_type: p.mime, data: p.data } }),
  }));
  const body = { model: opts.model, messages, max_tokens: opts.maxTokens || 8192, stream: true };
  if (opts.system) body.system = opts.system;
  if (opts.temperature != null) body.temperature = opts.temperature;
  return (async () => {
    const res = await netFetch(baseUrlOf(opts.provider) + '/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': opts.provider.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify(body),
      signal: opts.signal,
    }, 'provider');
    if (!res.ok) throw await providerError(res);
    let text = '';
    const usage = { input: 0, output: 0 };
    await readSse(res, (event, data) => {
      let json;
      try { json = JSON.parse(data); } catch (e) { return; }
      const kind = json.type || event;
      if (kind === 'content_block_delta' && json.delta && json.delta.type === 'text_delta') {
        text += json.delta.text; opts.onDelta(json.delta.text);
      } else if (kind === 'message_start' && json.message && json.message.usage) {
        usage.input = json.message.usage.input_tokens || 0;
      } else if (kind === 'message_delta' && json.usage) {
        usage.output = json.usage.output_tokens || 0;
      } else if (kind === 'error') {
        throw new Error((json.error && json.error.message) || 'error');
      }
    });
    return { text, usage };
  })();
}

function callGemini(opts) {
  const contents = opts.messages.map((m) => ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: m.parts.map((p) => p.type === 'text' ? { text: p.text } : { inline_data: { mime_type: p.mime, data: p.data } }),
  }));
  const body = { contents };
  if (opts.system) body.systemInstruction = { parts: [{ text: opts.system }] };
  const config = {};
  if (opts.temperature != null) config.temperature = opts.temperature;
  if (opts.maxTokens != null) config.maxOutputTokens = opts.maxTokens;
  if (Object.keys(config).length) body.generationConfig = config;
  return (async () => {
    const url = baseUrlOf(opts.provider) + '/v1beta/models/' + encodeURIComponent(opts.model) + ':streamGenerateContent?alt=sse&key=' + encodeURIComponent(opts.provider.apiKey);
    const res = await netFetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: opts.signal,
    }, 'provider');
    if (!res.ok) throw await providerError(res);
    let text = '';
    let usage = null;
    await readSse(res, (event, data) => {
      let json;
      try { json = JSON.parse(data); } catch (e) { return; }
      if (json.error) throw new Error(json.error.message || JSON.stringify(json.error));
      const candidate = json.candidates && json.candidates[0];
      const parts = candidate && candidate.content && candidate.content.parts;
      if (parts) for (const p of parts) if (typeof p.text === 'string' && p.text) { text += p.text; opts.onDelta(p.text); }
      if (json.usageMetadata) usage = { input: json.usageMetadata.promptTokenCount || 0, output: json.usageMetadata.candidatesTokenCount || 0 };
    });
    return { text, usage };
  })();
}

async function fetchModelList(p) {
  const base = baseUrlOf(p);
  if (p.type === 'anthropic') {
    const res = await netFetch(base + '/v1/models?limit=1000', { headers: {
      'x-api-key': p.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true',
    } }, 'provider');
    if (!res.ok) throw await providerError(res);
    const json = await res.json();
    return (json.data || []).map((m) => m.id).filter(Boolean);
  }
  if (p.type === 'gemini') {
    const res = await netFetch(base + '/v1beta/models?pageSize=1000&key=' + encodeURIComponent(p.apiKey), {}, 'provider');
    if (!res.ok) throw await providerError(res);
    const json = await res.json();
    return (json.models || [])
      .filter((m) => !m.supportedGenerationMethods || m.supportedGenerationMethods.includes('generateContent'))
      .map((m) => String(m.name || '').replace(/^models\//, '')).filter(Boolean);
  }
  const res = await netFetch(base + '/models', { headers: { 'Authorization': 'Bearer ' + p.apiKey } }, 'provider');
  if (!res.ok) throw await providerError(res);
  const json = await res.json();
  return (json.data || []).map((m) => m.id).filter(Boolean).sort();
}

async function loadSettings() {
  try {
    const saved = await api('GET', '/web/settings');
    if (saved && typeof saved === 'object') settings = Object.assign(settings, saved);
    if (!Array.isArray(settings.providers)) settings.providers = [];
    settingsLoaded = true;
  } catch (e) {
    if (e.status !== 401) toast(t('loadFailed') + errorText(e));
  }
}

async function boot() {
  log('boot', location.host, navigator.userAgent);
  applyStrings();
  renderConn();
  renderComposerState();
  if (!token) { showView('settings'); return; }
  await loadSettings();
  applyStrings();
  openWorker();
  await loadConversations();

  if (authOk && !(settings.providers || []).length && view !== 'settings') showView('settings');
  if (!cur.id) {

    let activeId = null;
    try { activeId = (await api('GET', '/api/conversations/active') || {}).conversationId || null; } catch (e) {   }
    const pick = conversations.find((c) => c.id === activeId) || conversations.find((c) => !c.hidden);
    if (pick && !cur.id) await openConversation(pick.id, pick.id !== activeId);
  }
  if (view === 'settings' && authOk) renderSettings();
}

function wire() {
  $('btn-list').onclick = () => { if ($('sidebar').classList.contains('open')) closeDrawer(); else openDrawer(); };
  $('scrim').onclick = closeDrawer;
  $('btn-new').onclick = newConversation;
  $('btn-settings').onclick = () => showView(view === 'settings' ? 'chat' : 'settings');
  $('btn-menu').onclick = (e) => { e.stopPropagation(); if (!cur.id) return; $('menu').hidden = !$('menu').hidden; };
  document.addEventListener('click', (e) => { if (!$('menu').contains(e.target)) $('menu').hidden = true; });
  $('menu-rename').onclick = () => { $('menu').hidden = true; renameConversation(); };
  $('menu-delete').onclick = () => { $('menu').hidden = true; deleteConversation(); };
  $('banner-close').onclick = () => { $('banner').hidden = true; sessionStorage.setItem('bannerClosed', '1'); };
  if (sessionStorage.getItem('bannerClosed')) $('banner').hidden = true;
  $('btn-send').onclick = sendMessage;
  $('setup-go').onclick = goToSetup;
  $('btn-stop').onclick = stopGeneration;
  $('btn-attach').onclick = () => $('file-input').click();
  $('file-input').onchange = async () => { const files = Array.from($('file-input').files || []); $('file-input').value = ''; await uploadFiles(files); };
  const input = $('input');
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.matchMedia('(min-width: 901px)').matches) {
      e.preventDefault();
      sendMessage();
    }
  });
  input.addEventListener('paste', (e) => {
    const files = Array.from((e.clipboardData && e.clipboardData.files) || []).filter((f) => /^image\//.test(f.type));
    if (files.length) { e.preventDefault(); uploadFiles(files); }
  });
  window.addEventListener('beforeunload', () => { closeStream(); if (workerES) workerES.close(); });
}

wire();
boot();
</script>

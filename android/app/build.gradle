apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def processCustomApk(String buildType) {
    println "Build type: ${buildType}"

    def apkDir = file("${buildDir}/outputs/apk/${buildType}")
    def originalApk = file("${apkDir}/app-${buildType}.apk")
    def customApk = file("${apkDir}/app-${buildType}-custom.apk")

    if (!originalApk.exists()) {
        throw new GradleException("Original APK file does not exist: ${originalApk.absolutePath}")
    }

    println "Starting to process ${buildType.toUpperCase()} APK: ${originalApk.absolutePath}"

    def tempDir = file("${buildDir}/temp/apk-custom-${buildType}")
    if (tempDir.exists()) {
        delete tempDir
    }
    tempDir.mkdirs()

    try {

        copy {
            from zipTree(originalApk)
            into tempDir
        }

        def libDir = file("${tempDir}/lib")
        if (libDir.exists()) {
            println "Processing lib directory: ${libDir.absolutePath}"

            libDir.listFiles().each { archDir ->
                if (archDir.isDirectory() && archDir.name != 'arm64-v8a') {
                    println "Deleting architecture directory: ${archDir.name}"
                    delete archDir
                }
            }

            def arm64Dir = file("${libDir}/arm64-v8a")
            if (arm64Dir.exists()) {
                def filesToDelete = [
                    'libc++_shared.so',
                    'libfbjni.so',
                    'libhermes.so',
                    'libhermestooling.so',
                    'libimagepipeline.so',
                    'libjsi.so',
                    'libnative-filters.so',
                    'libnative-imagetranscoder.so',
                    'libreactnative.so'
                ]

                filesToDelete.each { fileName ->
                    def soFile = file("${arm64Dir}/${fileName}")
                    if (soFile.exists()) {
                        println "Deleting so file: ${fileName}"
                        delete soFile
                    } else {
                        println "So file does not exist, skipping: ${fileName}"
                    }
                }

                println "Remaining files in arm64-v8a directory:"
                arm64Dir.listFiles().each { file ->
                    if (file.isFile()) {
                        println "  - ${file.name}"
                    }
                }
            } else {
                println "arm64-v8a directory does not exist"
            }
        } else {
            println "lib directory does not exist"
        }

        ant.zip(destfile: customApk, basedir: tempDir)

        println "Custom ${buildType.toUpperCase()} APK generated: ${customApk.absolutePath}"
        println "Original APK size: ${(originalApk.length() / 1024 / 1024).round(2)} MB"
        println "Custom APK size: ${(customApk.length() / 1024 / 1024).round(2)} MB"

    } finally {

        delete tempDir
    }
}

['Debug', 'Release'].each { variant ->
    def buildType = variant.toLowerCase()

    tasks.register("buildCustomApk${variant}") {
        group = 'custom'
        description = "编译 ${variant} APK 并删除指定的 so 库文件"
        dependsOn "assemble${variant}"

        doLast {
            processCustomApk(buildType)
        }
    }
}

react {
    debuggableVariants = ["debug", "release"]
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "me.laumss.notipal"
    defaultConfig {
        applicationId "me.laumss.notipal"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        
        ndk { abiFilters "arm64-v8a" }

        
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        
        
        // DEV_BUILD: packed with --with-logs (the scripts pass -PinklingDevBuild=true). Logs go to logcat and
        // features still in development are on. Otherwise logs go to the plugin's log file, exported from settings.
        // ENABLE_DEBUG: produce debug logs at all; on in both, -PinklingDebugLogs=false compiles them out.
        def devProp = findProperty("inklingDevBuild")?.toString()?.toLowerCase()
        def debugDevBuild = (devProp == "false") ? "false" : "true"
        def releaseDevBuild = (devProp == "true") ? "true" : "false"
        def debugLogs = (findProperty("inklingDebugLogs")?.toString()?.toLowerCase() == "false") ? "false" : "true"
        debug {
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "ENABLE_DEBUG", debugLogs
            buildConfigField "boolean", "DEV_BUILD", debugDevBuild
        }
        release {
            buildConfigField "boolean", "ENABLE_DEBUG", debugLogs
            buildConfigField "boolean", "DEV_BUILD", releaseDevBuild
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    aaptOptions {
        additionalParameters "--package-id", "0x71", "--allow-reserved-package-id"
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {

    
    implementation("org.java-websocket:Java-WebSocket:1.5.7")
    implementation("com.google.zxing:core:3.5.3")

    implementation("com.facebook.react:react-android")

    // 宿主 plugincommon 数据类（Element / PluginAPIResponse 等）。运行时由 PluginHost 提供，
    // 这里只参与编译，供原生 getElements + VectorPageRenderer 使用（与 hardcopy 同源）。
    compileOnly files("$rootDir/../node_modules/sn-plugin-lib/android/libs/plugincommonlib.aar")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
